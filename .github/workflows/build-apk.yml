name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Detect and Prepare Project Root
        id: prep
        run: |
          if [ -f "music-app-main/settings.gradle.kts" ]; then
            echo "BUILD_DIR=music-app-main" >> $GITHUB_ENV
            echo "Detected music-app-main directory as Android root"
          else
            echo "BUILD_DIR=." >> $GITHUB_ENV
            echo "Using current workspace root as Android root"
          fi

      - name: Generate Gradle Wrapper
        run: |
          cd $BUILD_DIR
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd $BUILD_DIR
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Files
        run: |
          mkdir -p build-outputs
          if [ -f "$BUILD_DIR/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp $BUILD_DIR/app/build/outputs/apk/debug/app-debug.apk build-outputs/MJPulse-Music.apk
            cp $BUILD_DIR/app/build/outputs/apk/debug/app-debug.apk build-outputs/app-debug.apk
          elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-outputs/MJPulse-Music.apk
            cp app/build/outputs/apk/debug/app-debug.apk build-outputs/app-debug.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MJPulse-Music-APK
          path: |
            build-outputs/MJPulse-Music.apk
            build-outputs/app-debug.apk

      - name: Create or Update GitHub Release v1.3.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "MJ PULSE Music v1.3.0 (Dynamic Genre Streaming & Equalizer)"
          body: |
            ### 🎵 MJ PULSE Music v1.3.0 Update Released!
            
            - **Dynamic Genre Switching**: Real-time high-fidelity streaming for Synthwave, EDM, Lo-Fi, Bass Boost, Punjabi Pop, and Trending Hits.
            - **Studio 5-Band Equalizer**: Live audio frequency visualizer and customized soundstage curves.
            - **Synced Karaoke Lyrics**: Dual-pane synced lyrics with live glow and auto-scroll.
            - **DJ Decks Support**: Filter tracks directly by genre on virtual decks.
            - **Consistent Keystore Signature**: Seamless in-place updates.
            
            **Direct Download Links**:
            - [Download MJPulse-Music.apk](https://github.com/Mahendrajatav2006/music-app/releases/download/v1.3.0/MJPulse-Music.apk)
            - [Download app-debug.apk](https://github.com/Mahendrajatav2006/music-app/releases/download/v1.3.0/app-debug.apk)
          files: |
            build-outputs/MJPulse-Music.apk
            build-outputs/app-debug.apk

      - name: Update GitHub Release v1.2.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "MJ PULSE Music v1.2.0 (Updated to v1.3.0)"
          body: "Official Android APK for MJ PULSE Music v1.3.0"
          files: |
            build-outputs/MJPulse-Music.apk
            build-outputs/app-debug.apk

      - name: Update GitHub Release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "MJ PULSE Music v1.0.0 (Updated to v1.3.0)"
          body: "Official Android APK for MJ PULSE Music v1.3.0"
          files: |
            build-outputs/MJPulse-Music.apk
            build-outputs/app-debug.apk
