name: Build Android APK & Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK File
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/app-debug.apk release_apk/MJPulse-Music.apk
          cp app/build/outputs/apk/debug/app-debug.apk release_apk/app-debug.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MJPulse-Music-APK
          path: release_apk/MJPulse-Music.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0
          name: "MJ PULSE Music v1.2.0 (Smart Recommendations & History)"
          body: |
            ### 🎵 MJ PULSE Music v1.2.0 Update Released!
            
            Download and install the official Android APK update below:
            
            - **Smart Related Auto-Play**: Automatically queues matching songs by artist and genre (no random tracks).
            - **Listening History Screen**: Dedicated history tab and home screen recently played carousel.
            - **Party Mode Haptics**: 60fps haptic vibration sync with kick/snare beat clock.
            - **Consistent Signature**: Signed with persistent keystore for seamless in-place updates.
            
            **Direct Download Links**:
            - [Download MJPulse-Music.apk](https://github.com/Mahendrajatav2006/music-app/releases/download/v1.2.0/MJPulse-Music.apk)
            - [Download app-debug.apk](https://github.com/Mahendrajatav2006/music-app/releases/download/v1.2.0/app-debug.apk)
          draft: false
          prerelease: false
          files: |
            release_apk/MJPulse-Music.apk
            release_apk/app-debug.apk
