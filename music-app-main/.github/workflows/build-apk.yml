name: Build Android APK & Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK File
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/app-debug.apk release_apk/MJPulse-Music.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MJPulse-Music-APK
          path: release_apk/MJPulse-Music.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "MJ PULSE Music v1.0.0 (Official Release)"
          body: |
            ### 🎵 Welcome to MJ PULSE Music!
            
            Download the official Android APK below to install on your phone:
            
            - **Direct Download**: Click `MJPulse-Music.apk` below
            - **High-Fidelity Audio**: Crystal clear music streaming
            - **Clean Experience**: Ad-free, no third-party branding
            
            *Enjoy the music!*
          draft: false
          prerelease: false
          files: release_apk/MJPulse-Music.apk
