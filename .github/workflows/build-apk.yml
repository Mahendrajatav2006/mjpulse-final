name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: music-app-main

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Files
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MJPulse-Music.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MJPulse-Music-APK
          path: |
            music-app-main/app/build/outputs/apk/debug/MJPulse-Music.apk
            music-app-main/app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update GitHub Release v1.2.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "MJ PULSE Music v1.2.0 (Smart Recommendations & History)"
          body: |
            ### 🎵 MJ PULSE Music v1.2.0 Update Released!
            
            - **Smart Related Auto-Play**: Automatically queues matching songs by artist and genre (no random tracks).
            - **Listening History Screen**: Dedicated history tab and home screen recently played carousel.
            - **Party Mode Haptics**: 60fps haptic vibration sync with kick/snare beat clock.
            - **Consistent Signature**: Signed with persistent keystore for seamless future in-place updates.
            
            **Direct Download Links**:
            - [Download MJPulse-Music.apk](https://github.com/Mahendrajatav2006/music-app/releases/download/v1.2.0/MJPulse-Music.apk)
            - [Download app-debug.apk](https://github.com/Mahendrajatav2006/music-app/releases/download/v1.2.0/app-debug.apk)
          files: |
            music-app-main/app/build/outputs/apk/debug/MJPulse-Music.apk
            music-app-main/app/build/outputs/apk/debug/app-debug.apk

      - name: Update GitHub Release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "MJ PULSE Music v1.0.0 (Updated to v1.2.0)"
          body: "Official Android APK for MJ PULSE Music v1.2.0"
          files: |
            music-app-main/app/build/outputs/apk/debug/MJPulse-Music.apk
            music-app-main/app/build/outputs/apk/debug/app-debug.apk
